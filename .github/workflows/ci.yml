name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libusb-1.0-0-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Check whitespace
        run: git diff --check

  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install libusb
        shell: pwsh
        run: vcpkg install libusb:x64-windows

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/windows -A x64
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run offline tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure
