name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config libusb-1.0-0-dev

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Check whitespace
        run: git diff --check
